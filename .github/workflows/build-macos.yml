mkdir -p .github/workflows
cat << 'EOF' > .github/workflows/build-macos.yml
name: Build Custom macOS Warp
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-bundle

      - name: Build WarpOss.app Bundle
        run: |
          cargo bundle --release --bin warp-oss

      - name: Package .app for Download
        run: |
          cd target/release/bundle/osx
          zip -r WarpOss-macOS.zip WarpOss.app

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpOss-macOS-Installer
          path: target/release/bundle/osx/WarpOss-macOS.zip
EOF
