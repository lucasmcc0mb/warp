name: Build Custom macOS Warp

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node & Corepack
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable

      - name: Install Rust Toolchain
        run: |
          rustup toolchain install 1.80.0
          rustup default 1.80.0

      - name: Install Stable cargo-bundle (No Sigstore)
        run: |
          cargo install cargo-bundle --version 0.5.0

      - name: Install Protobuf Compiler (protoc)
        run: brew install protobuf

      - name: Build WarpOss.app Release Bundle
        run: |
          cd app
          cargo bundle --release

      - name: Zip WarpOss.app for macOS Installation
        run: |
          BUNDLE_DIR="app/target/release/bundle/osx"
          ls -la "$BUNDLE_DIR"
          APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.app" | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/WarpOss-macOS.zip"

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpOss-macOS-App
          path: WarpOss-macOS.zip
